name: Cement Demand MLOps CI


on:

  push:

    branches:
      - main

  pull_request:

    branches:
      - main



jobs:


  build-test:


    runs-on: ubuntu-latest


    steps:


    # Checkout repository

    - name: Checkout code

      uses: actions/checkout@v4



    # Setup Python

    - name: Setup Python

      uses: actions/setup-python@v5

      with:

        python-version: "3.10"



    # Install dependencies

    - name: Install dependencies

      run: |

        python -m pip install --upgrade pip

        pip install -r requirements.txt



    # Run tests

    - name: Run tests

      run: |

        export PYTHONPATH=$PYTHONPATH:.

        pytest -v



    # Docker build

    - name: Build Docker image

      run: |

        docker build \
        -t ${{ secrets.DOCKER_USERNAME }}/cement-demand-api:latest .



    # Login Docker Hub

    - name: Login to Docker Hub

      uses: docker/login-action@v3

      with:

        username: ${{ secrets.yogeshgovindan }}

        password: ${{ secrets.Luna@2026 }}



    # Push Docker Image

    - name: Push Docker Image

      run: |

        docker push \
        ${{ secrets.DOCKER_USERNAME }}/cement-demand-api:latest